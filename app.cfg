# wup-doom: Doom on the Wii U GamePad (doomgeneric's engine, Chocolate Doom's OPL music on emu8950). The shareware
# episode (doom1.wad) comes with it.
name = Doom
author = id Software, wup-homebrew
version = 1.0.0
description = The shareware episode, with OPL music
icon = icon.png
url = https://github.com/ravensclawx/wup-doom
deps = doomgeneric chocolate-doom emu8950
include = src ../libwup/third_party/doomgeneric/doomgeneric ../libwup/third_party/chocolate-doom/opl ../libwup/third_party/emu8950
sources = src/*.c
    ../libwup/third_party/doomgeneric/doomgeneric/*.c
    !../libwup/third_party/doomgeneric/doomgeneric/doomgeneric*.c
    !../libwup/third_party/doomgeneric/doomgeneric/i_video.c
    !../libwup/third_party/doomgeneric/doomgeneric/i_system.c
    !../libwup/third_party/doomgeneric/doomgeneric/z_zone.c
    !../libwup/third_party/doomgeneric/doomgeneric/i_input.c
    !../libwup/third_party/doomgeneric/doomgeneric/i_sdl*.c
    !../libwup/third_party/doomgeneric/doomgeneric/i_allegro*.c
    !../libwup/third_party/doomgeneric/doomgeneric/icon.c
    !../libwup/third_party/doomgeneric/doomgeneric/w_file_stdc.c
    ../libwup/third_party/chocolate-doom/opl/opl_queue.c
    ../libwup/third_party/emu8950/emu8950.c
    ../libwup/third_party/emu8950/emuadpcm.c
defines = NORMALUNIX LINUX FEATURE_SOUND music_opl_module=DG_music_module
cflags = -O2 -Wno-everything
files = doom1.wad          # the shareware episode, beside the app (/apps/doom/)
